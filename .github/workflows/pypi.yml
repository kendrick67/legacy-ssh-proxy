name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goarm: ""
            ext: ""
            plat_tag: manylinux_2_17_x86_64
          - goos: linux
            goarch: arm64
            goarm: ""
            ext: ""
            plat_tag: manylinux_2_17_aarch64
          - goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
            plat_tag: manylinux_2_17_armv7l
          - goos: darwin
            goarch: amd64
            goarm: ""
            ext: ""
            plat_tag: macosx_10_9_x86_64
          - goos: darwin
            goarch: arm64
            goarm: ""
            ext: ""
            plat_tag: macosx_11_0_arm64
          - goos: windows
            goarch: amd64
            goarm: ""
            ext: ".exe"
            plat_tag: win_amd64
          - goos: windows
            goarch: arm64
            goarm: ""
            ext: ".exe"
            plat_tag: win_arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build tools
        run: python -m pip install --upgrade pip build wheel

      - name: Cross-compile Go binary for target architecture
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p python/src/legacy_ssh_proxy/bin
          go build -ldflags="-s -w" \
            -o python/src/legacy_ssh_proxy/bin/legacy-ssh-proxy${{ matrix.ext }} \
            ./cmd/legacy-ssh-proxy

      - name: Sync version from Git tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = .*/version = \"$VERSION\"/" python/pyproject.toml

      - name: Build and tag platform-specific wheel
        working-directory: python
        run: |
          python -m build --wheel --outdir dist-raw
          wheel tags --remove --platform-tag ${{ matrix.plat_tag }} dist-raw/*.whl
          mkdir -p dist
          mv dist-raw/*.whl dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: python/dist/*.whl

  publish-pypi:
    name: Publish all wheels to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org
    permissions:
      id-token: write

    steps:
      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
