[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-ssh-proxy"
version = "0.1.0"
description = "Python wrapper and context manager for Legacy SSH Proxy"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = []

[project.scripts]
legacy-ssh-proxy = "legacy_ssh_proxy.cli:main"

[tool.setuptools.package-data]
legacy_ssh_proxy = ["bin/*"]
